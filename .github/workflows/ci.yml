name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873 # 18.0-alpine
        env:
          POSTGRES_USER: johndoe
          POSTGRES_PASSWORD: randompassword
          POSTGRES_DB: mydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://johndoe:randompassword@localhost:5432/mydb?schema=public
      SHADOW_DATABASE_URL: postgresql://johndoe:randompassword@localhost:5432/kineo_shadow?schema=public
      TEST_DATABASE_ADMIN_URL: postgresql://johndoe:randompassword@localhost:5432/postgres
      BETTER_AUTH_SECRET: ci_secret_ci_secret_ci_secret_ci_secret_ci_secret
      BETTER_AUTH_URL: http://localhost:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx prisma validate
      - run: bun run db:generate
      # Nothing before this applies the schema: `validate` reads schema.prisma and
      # `db:generate` writes the client, neither touches the database, and the
      # service hands over an empty `mydb`. Without it `db:seed` died on P2021,
      # which the e2e suites hid — each of them migrates its own throwaway
      # database, so they passed while the application database had no tables.
      - run: bunx prisma migrate deploy
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      # Each suite creates and drops its own throwaway database, so it needs the
      # admin URL of the postgres instance rather than the application database.
      #
      # This is the only step that retries, and only for one failure. Bun races on
      # `require()` of a module the same graph already reached by `import`:
      # `@nestjs/throttler` is CommonJS and requires `@nestjs/common`, which is
      # ESM-only since NestJS 12, so when the suite boots the real AppModule the
      # two paths race and Bun sometimes reports an `Invalid ... invocation`
      # TypeError for a module with no top-level await at all. It is Bun
      # [#33180](https://github.com/oven-sh/bun/issues/33180), regressed in 1.3.14
      # and unfixed — [#37185](https://github.com/oven-sh/bun/pull/37185) is still
      # open, so no released version has it. Whether a run loses the race depends
      # on module size and machine speed, not on the code under test.
      #
      # Two attempts, then a hard failure that names this. Not a blanket `|| true`:
      # a genuine failure here is a broken suite or a broken application, and two
      # runs is already more than the race is ever known to need. Delete this retry
      # when Bun ships the fix.
      - name: Run the e2e suites
        run: |
          for attempt in 1 2; do
            echo "--- e2e attempt ${attempt} of 2 ---"
            if bun run test:e2e; then
              exit 0
            fi
            if [ "${attempt}" = "2" ]; then
              echo "::error::The e2e suites failed twice. If the log shows" \
                "'require() async module \"...@nestjs/common/index.js\" is unsupported'," \
                "that is Bun issue #33180 and not a defect in this repository;" \
                "the retry above is the workaround and can be dropped once it is fixed." \
                "Anything else is a real failure."
              exit 1
            fi
          done
      - run: bun run db:seed
      # `db:check` replays the history into the shadow database and Prisma wants
      # it to exist: the service image creates `mydb` and nothing else, so the
      # step died on P1003. It is emptied on every run, which is why it is created
      # here rather than seeded.
      - name: Create the shadow database
        run: |
          PGPASSWORD=randompassword psql \
            --host localhost \
            --username johndoe \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --command 'CREATE DATABASE kineo_shadow'
      # Diffs that replay against schema.prisma, so it gates the migrations
      # themselves and reads neither `mydb` nor the rows the seed just wrote. Its
      # position here is the order the gates are named in, not a dependency.
      - run: bun run db:check