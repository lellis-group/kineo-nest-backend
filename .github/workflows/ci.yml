name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873 # 18.0-alpine
        env:
          POSTGRES_USER: johndoe
          POSTGRES_PASSWORD: randompassword
          POSTGRES_DB: mydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://johndoe:randompassword@localhost:5432/mydb?schema=public
      SHADOW_DATABASE_URL: postgresql://johndoe:randompassword@localhost:5432/kineo_shadow?schema=public
      TEST_DATABASE_ADMIN_URL: postgresql://johndoe:randompassword@localhost:5432/postgres
      BETTER_AUTH_SECRET: ci_secret_ci_secret_ci_secret_ci_secret_ci_secret
      BETTER_AUTH_URL: http://localhost:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx prisma validate
      - run: bun run db:generate
      # Nothing before this applies the schema: `validate` reads schema.prisma and
      # `db:generate` writes the client, neither touches the database, and the
      # service hands over an empty `mydb`. Without it `db:seed` died on P2021,
      # which the e2e suites hid — each of them migrates its own throwaway
      # database, so they passed while the application database had no tables.
      - run: bunx prisma migrate deploy
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      # Each suite creates and drops its own throwaway database, so it needs the
      # admin URL of the postgres instance rather than the application database.
      - run: bun run test:e2e
      - run: bun run db:seed
      # `db:check` replays the history into the shadow database and Prisma wants
      # it to exist: the service image creates `mydb` and nothing else, so the
      # step died on P1003. It is emptied on every run, which is why it is created
      # here rather than seeded.
      - name: Create the shadow database
        run: |
          PGPASSWORD=randompassword psql \
            --host localhost \
            --username johndoe \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --command 'CREATE DATABASE kineo_shadow'
      # Diffs that replay against schema.prisma, so it gates the migrations
      # themselves and reads neither `mydb` nor the rows the seed just wrote. Its
      # position here is the order the gates are named in, not a dependency.
      - run: bun run db:check