services:
  postgres:
    image: postgres:18-alpine
    container_name: my-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: johndoe
      POSTGRES_PASSWORD: randompassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit
    container_name: my-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Optional: point REDIS_URL at this to share the throttle buckets between
  # replicas. Without it the throttler counts in memory, per process.
  redis:
    image: redis:8-alpine
    container_name: my-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # S3-compatible object storage for avatars, listing images and CVs, used when
  # STORAGE_DRIVER=s3. The API reads the same S3_* credentials, so there is one
  # pair to rotate. The named volume needs no bind-mount permission setup:
  # RustFS's non-root user (10001) owns the volume's /data.
  rustfs:
    image: rustfs/rustfs:latest
    container_name: my-rustfs
    restart: unless-stopped
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - rustfs-data:/data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
      # Under /data so the non-root container user (10001) owns it. The docs'
      # /var/log/rustfs/ path needs a separate permission-fixing init container;
      # this project keeps the single named volume instead.
      RUSTFS_OBS_LOG_DIRECTORY: "/data/logs/"
    command: /data

  # @nestjs/storage's S3Disk expects the bucket to exist. Create it once with
  # `bun run files:bucket` after starting RustFS; that script is idempotent.

volumes:
  postgres_data:
  rustfs-data:
