services:
  postgres:
    image: postgres:18-alpine
    container_name: my-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: johndoe
      POSTGRES_PASSWORD: randompassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit
    container_name: my-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Optional: point REDIS_URL at this to share the throttle buckets between
  # replicas. Without it the throttler counts in memory, per process.
  redis:
    image: redis:8-alpine
    container_name: my-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: